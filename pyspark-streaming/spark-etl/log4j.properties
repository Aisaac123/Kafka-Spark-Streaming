# log4j.properties

# Nivel por defecto para tu aplicación (puedes ajustarlo a INFO si quieres ver tus logger.info)
log4j.rootCategory=INFO, console

# Appender para imprimir por consola
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Silencia los ejecutores y TaskSetManager al nivel ERROR
log4j.logger.org.apache.spark.executor.Executor=ERROR
log4j.logger.org.apache.spark.scheduler.TaskSetManager=ERROR

# (Opcional) Silencia también el JDBC internals
log4j.logger.org.apache.spark.sql.execution.datasources.jdbc.JdbcUtils=ERROR